<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: white;
        }
        
        .logo-container {
            width: 300px;
            height: 300px;
        }
        
        .container {
            fill: none;
            stroke: #38b6ff;
            stroke-width: 4;
        }
        
        .liquid {
            fill: #38b6ff;
            animation: flow 4s infinite cubic-bezier(0.2, 0, 0.8, 1);
        }
        
        @keyframes flow {
            0% {
                transform: translateX(-50px) scaleX(1.3) translateY(0) rotate(-2deg);
            }
            20% {
                transform: translateX(-20px) scaleX(1.1) translateY(5px) rotate(-1deg);
            }
            40% {
                transform: translateX(0) scaleX(1) translateY(15px) rotate(0deg);
            }
            60% {
                transform: translateX(50px) scaleX(1.3) translateY(0) rotate(2deg);
            }
            80% {
                transform: translateX(20px) scaleX(1.1) translateY(5px) rotate(1deg);
            }
            100% {
                transform: translateX(-50px) scaleX(1.3) translateY(0) rotate(-2deg);
            }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <svg width="300" height="300" viewBox="0 0 300 300">
            <!-- 正方形容器 -->
            <rect class="container" x="50" y="50" width="200" height="200"/>
            
            <!-- 定义裁剪路径，与正方形容器内部形状一致 -->
            <defs>
                <clipPath id="clipPath">
                    <rect x="50" y="50" width="200" height="200"/>
                </clipPath>
            </defs>
            
            <!-- 液体 -->
            <g clip-path="url(#clipPath)">
                <path class="liquid" d="M30,250 Q60,230 90,250 Q120,270 150,250 Q180,230 210,250 Q240,270 270,250 L270,300 L30,300 Z"/>
            </g>
        </svg>
    </div>
</body>
</html>
