<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo 完成历史</title>
    <link rel="stylesheet" href="./node_modules/@fontsource/noto-sans-sc/400.css">
    <link rel="stylesheet" href="./node_modules/@fontsource/noto-sans-sc/600.css">
    <link rel="stylesheet" href="./node_modules/@fontsource/noto-sans-sc/700.css">
    <script src="./node_modules/lucide/dist/umd/lucide.min.js"></script>
    <style>
        :root {
            color-scheme: light;
            --ink: #1d2a30;
            --muted: #718087;
            --line: rgba(40, 62, 68, 0.12);
            --accent: #2f7e82;
            --accent-soft: #dceeed;
            --surface: rgba(255, 255, 255, 0.82);
            --shadow: 0 18px 45px rgba(40, 67, 72, 0.12);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-width: 680px;
            min-height: 100vh;
            color: var(--ink);
            font-family: "Noto Sans SC", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 10% 0%, rgba(210, 235, 231, 0.75), transparent 34%),
                #edf3f2;
        }
        .page { max-width: 1180px; margin: 0 auto; padding: 34px; }
        .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
        .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; }
        h1 { margin: 0; font-size: 28px; letter-spacing: 0; }
        .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
        .toolbar { display: flex; align-items: center; gap: 8px; }
        button, input { font: inherit; }
        button { border: 0; cursor: pointer; }
        .button {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-height: 34px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--ink);
            background: rgba(255, 255, 255, 0.72);
        }
        .button:hover { border-color: rgba(47, 126, 130, 0.34); background: #fff; }
        .button.primary { color: #fff; border-color: var(--accent); background: var(--accent); }
        .button.primary:hover { background: #256c70; }
        .search {
            width: min(300px, 30vw);
            min-height: 34px;
            padding: 0 11px;
            border: 1px solid var(--line);
            border-radius: 8px;
            outline: 0;
            color: var(--ink);
            background: rgba(255, 255, 255, 0.78);
        }
        .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
        .stat { padding: 15px 17px; border: 1px solid rgba(255,255,255,0.8); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); }
        .stat-label { color: var(--muted); font-size: 11px; }
        .stat-value { margin-top: 5px; font-size: 22px; font-weight: 700; }
        .history-list { display: grid; gap: 10px; }
        .record {
            display: grid;
            grid-template-columns: 58px minmax(0, 1fr) auto;
            gap: 16px;
            align-items: start;
            padding: 17px 18px;
            border: 1px solid rgba(255,255,255,0.85);
            border-radius: 10px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }
        .record-number { color: var(--accent); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .record-title { font-size: 15px; font-weight: 600; }
        .record-note { margin-top: 6px; color: #596a70; font-size: 12px; line-height: 1.6; white-space: pre-wrap; }
        .record-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 9px; color: var(--muted); font-size: 11px; }
        .record-doc { align-self: center; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .empty { padding: 70px 20px; color: var(--muted); text-align: center; }
        .status { min-height: 18px; margin-top: 14px; color: var(--muted); font-size: 11px; }
        [data-lucide] { width: 15px; height: 15px; stroke-width: 1.8; }
        @media (max-width: 820px) {
            .page { padding: 22px; }
            .topbar { align-items: flex-start; flex-direction: column; }
            .toolbar { width: 100%; }
            .search { width: 100%; flex: 1; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="topbar">
            <div>
                <p class="eyebrow">Todo Archive</p>
                <h1>完成历史</h1>
                <p class="subtitle">这里展示所有已经完成的 Todo。未完成或提前删除的任务不会进入归档。</p>
            </div>
            <div class="toolbar">
                <input class="search" id="search" type="search" placeholder="搜索标题或备注">
                <button class="button primary" id="refresh" type="button"><i data-lucide="refresh-cw"></i>刷新</button>
            </div>
        </header>

        <section class="summary" aria-label="历史统计">
            <div class="stat"><div class="stat-label">完成总数</div><div class="stat-value" id="total">0</div></div>
            <div class="stat"><div class="stat-label">累计耗时</div><div class="stat-value" id="duration">0 分钟</div></div>
            <div class="stat"><div class="stat-label">最近完成</div><div class="stat-value" id="latest">暂无</div></div>
        </section>

        <section class="history-list" id="historyList"></section>
        <div class="status" id="status"></div>
    </main>

    <script>
        const list = document.getElementById("historyList");
        const search = document.getElementById("search");
        const total = document.getElementById("total");
        const duration = document.getElementById("duration");
        const latest = document.getElementById("latest");
        const status = document.getElementById("status");
        let records = [];

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
            }[char]));
        }

        function formatDate(value) {
            if (!value) return "未记录";
            return new Intl.DateTimeFormat("zh-CN", {
                year: "numeric", month: "2-digit", day: "2-digit",
                hour: "2-digit", minute: "2-digit"
            }).format(new Date(value)).replace(/\//g, "-");
        }

        function formatDuration(milliseconds) {
            const minutes = Math.max(1, Math.floor((Number(milliseconds) || 0) / 60000));
            const hours = Math.floor(minutes / 60);
            const rest = minutes % 60;
            return hours ? `${hours} 小时 ${rest} 分钟` : `${minutes} 分钟`;
        }

        function render() {
            const query = search.value.trim().toLowerCase();
            const visible = records.filter(record =>
                !query || `${record.text} ${record.note || ""}`.toLowerCase().includes(query)
            );
            const totalMinutes = records.reduce((sum, record) => sum + Math.max(1, Math.floor((record.completedAt - record.createdAt) / 60000)), 0);
            total.textContent = records.length;
            duration.textContent = formatDuration(totalMinutes * 60000);
            latest.textContent = records[0]?.completedAt ? formatDate(records[0].completedAt).slice(0, 10) : "暂无";
            list.innerHTML = visible.length ? visible.map(record => `
                <article class="record">
                    <div class="record-number">#${String(record.serial).padStart(3, "0")}</div>
                    <div>
                        <div class="record-title">${escapeHtml(record.text)}</div>
                        ${record.note ? `<div class="record-note">${escapeHtml(record.note)}</div>` : ""}
                        <div class="record-meta">
                            <span>创建 ${formatDate(record.createdAt)}</span>
                            <span>完成 ${formatDate(record.completedAt)}</span>
                            <span>耗时 ${formatDuration(record.completedAt - record.createdAt)}</span>
                        </div>
                    </div>
                    ${record.document ? `<button class="button record-doc" type="button" data-path="${escapeHtml(record.document.path)}" title="打开 ${escapeHtml(record.document.name)}"><i data-lucide="external-link"></i>${escapeHtml(record.document.name)}</button>` : ""}
                </article>
            `).join("") : '<div class="empty">没有匹配的完成记录。</div>';
            window.lucide?.createIcons();
        }

        async function load() {
            if (!window.desktopAPI) {
                status.textContent = "请从桌面应用中打开历史视图。";
                return;
            }
            const result = await window.desktopAPI.loadTodoFile();
            records = (result.todos || []).filter(todo => todo.done).sort((a, b) => (b.serial || 0) - (a.serial || 0));
            status.textContent = `归档文件：${result.path}`;
            render();
        }

        list.addEventListener("click", async event => {
            const button = event.target.closest("[data-path]");
            if (!button || !window.desktopAPI) return;
            const result = await window.desktopAPI.openDocument(button.dataset.path);
            if (!result.ok) status.textContent = "无法打开关联文档。";
        });
        search.addEventListener("input", render);
        document.getElementById("refresh").addEventListener("click", load);
        window.lucide?.createIcons();
        load();
    </script>
</body>
</html>
